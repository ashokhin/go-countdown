name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the Makefile derives the app's displayed
          # version from `git describe --tags`, which needs both to find
          # the tag that triggered this run.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Builds both platforms into ./bin — Windows needs no extra
      # toolchain since Wails talks to WebView2 via pure-Go syscalls, same
      # as a local `make build-all`.
      - name: Build
        run: make build-all

      - name: Rename binaries for the release
        run: |
          mv bin/go-countdown bin/go-countdown-linux-amd64
          mv bin/go-countdown.exe bin/go-countdown-windows-amd64.exe

      # A tag can be force-moved to a different commit and re-pushed (e.g.
      # after fixing something CI caught) — this reruns the workflow for
      # the same tag name, and `gh release create` refuses to touch an
      # existing release. Deleting any previous release for this tag first
      # (never the tag itself — only `--cleanup-tag` would do that) makes
      # re-running idempotent instead of requiring a manual cleanup in the
      # GitHub UI.
      - name: Delete previous release for this tag, if any
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --yes || true

      # --generate-notes alone only produces a "Full Changelog" compare
      # link — its "What's Changed" section is built from merged PRs, and
      # most commits here land on main directly rather than through one.
      # Listing commit subjects explicitly (--no-merges drops the
      # "Merge pull request #N..." noise from merged Dependabot PRs; the
      # bump commit each one brought in already says what changed) gives
      # an actual changelog instead of just a link to one.
      - name: Build release notes
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)

          {
            echo "## Changes"
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty=format:"- %s (%h)" "$PREV_TAG..$TAG"
            else
              git log --no-merges --pretty=format:"- %s (%h)" "$TAG"
            fi
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG"
            fi
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            bin/go-countdown-linux-amd64 \
            bin/go-countdown-windows-amd64.exe \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Countdown Timers</title>
    <link rel="stylesheet" href="./src/style.css"/>
</head>
<body>
<div id="app">
    <header class="top-bar">
        <div class="bar-row bar-row-aux">
            <div id="theme-switch" class="theme-switch" role="group" aria-label="Theme">
                <button id="theme-light-btn" class="theme-switch-btn" type="button" data-theme-value="light" aria-label="Light theme" title="Light">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
                    </svg>
                </button>
                <button id="theme-dark-btn" class="theme-switch-btn" type="button" data-theme-value="dark" aria-label="Dark theme" title="Dark">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
                    </svg>
                </button>
                <button id="theme-system-btn" class="theme-switch-btn" type="button" data-theme-value="system" aria-label="System theme" title="System">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="12" rx="2"/>
                        <path d="M8 20h8M12 16v4"/>
                    </svg>
                </button>
            </div>
            <span class="spacer"></span>
            <button id="about-btn" class="icon-btn icon-btn-round" type="button" aria-label="About">i</button>
        </div>
        <div class="bar-row bar-row-main">
            <button id="zoom-out-btn" class="icon-btn" type="button" aria-label="Zoom out">－</button>
            <button id="zoom-in-btn" class="icon-btn" type="button" aria-label="Zoom in">＋</button>
            <span class="spacer"></span>
            <button id="add-timer-btn" class="btn">Add Timer</button>
        </div>
    </header>

    <p id="empty-state" class="empty-state" hidden>No timers yet — click "Add Timer" to get started.</p>

    <div class="table-wrap">
        <table id="timer-table" class="timer-table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Days</th>
                <th>Hours</th>
                <th>Minutes</th>
                <th>Seconds</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="timer-rows"></tbody>
        </table>
    </div>
</div>

<div id="modal-backdrop" class="modal-backdrop" hidden>
    <form id="timer-form" class="modal">
        <header class="modal-header">
            <h2 id="modal-title">Add Timer</h2>
            <button type="button" id="modal-close-btn" class="icon-btn" aria-label="Close">✕</button>
        </header>
        <label class="field">
            <span>Event name</span>
            <input type="text" id="timer-name" name="name" placeholder="Event name"/>
        </label>
        <label class="field">
            <span>Date &amp; time</span>
            <input type="datetime-local" id="timer-target" name="target" required/>
        </label>
        <p id="form-error" class="form-error" hidden></p>
        <footer class="modal-footer">
            <button type="submit" id="modal-submit-btn" class="btn">Add Timer</button>
        </footer>
    </form>
</div>

<div id="about-backdrop" class="modal-backdrop" hidden>
    <div class="modal">
        <header class="modal-header">
            <h2>About</h2>
            <button type="button" id="about-close-btn" class="icon-btn" aria-label="Close">✕</button>
        </header>
        <dl id="about-body" class="about-body"></dl>
        <footer class="modal-footer">
            <a id="about-repo-link" class="btn" href="#" target="_blank" rel="noopener">View on GitHub</a>
        </footer>
    </div>
</div>

<script src="./src/main.js" type="module"></script>
</body>
</html>
